spring.application.name=sync-async-api

#the server port
server.port=8081

#logging configurations
logging.file.name=logs/syncasync-api.log
logging.logback.rollingpolicy.max-history=10
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.file-name-pattern=logs/syncasync-api.%d{yyyy-MM-dd}.%i.log

#request parameters date formatting
spring.mvc.format.date=yyyy-MM-dd

#blockchain connection properties
blockchain.msp-id=Org1MSP
blockchain.channel-name=sync-async-channel
blockchain.chaincode-name=sync-async-chaincode
blockchain.crypto-path=/home/radu/scoala/2026-2027/ICECER-2026/CODE/fabric-2.5.16/fabric-samples/test-network/organizations/peerOrganizations/org1.example.com
blockchain.cert-path=users/User1@org1.example.com/msp/signcerts/User1@org1.example.com-cert.pem
blockchain.key-dir-path=users/User1@org1.example.com/msp/keystore
blockchain.tls-cert-path=peers/peer0.org1.example.com/tls/ca.crt
blockchain.peer-endpoint=localhost:7051
blockchain.override_authority=peer0.org1.example.com

#rabbitmq connection properties
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.listener.simple.prefetch=1

#enble/disable authorization
authorization.enabled=false
